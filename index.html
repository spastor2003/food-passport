<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Digital Food Passport — Paris</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--paper:#efe4ce;--paper2:#fbf5e7;--ink:#30281f;--muted:#746756;--red:#9e4d43;--turq:#739c98;--turq2:#d6e0d8;--line:#c8b79b;--green:#7d907f}
*{box-sizing:border-box}body{margin:0;background:#d9d0bf;color:var(--ink);font-family:"Bookman Old Style",Bookman,Georgia,"Times New Roman",serif}
button{font:inherit}.app{min-height:100vh;max-width:1180px;margin:auto;background:var(--paper);box-shadow:0 18px 45px #372a1b29}
header{height:70px;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--turq);background:#fbf6eaf2;position:sticky;top:0;z-index:1000}
.brand{font-size:12px;letter-spacing:.08em;text-transform:uppercase}.brand b{font-size:15px}.ghost{border:1px solid var(--line);background:var(--turq2);border-radius:5px;padding:8px 12px;cursor:pointer;margin-left:6px;text-transform:uppercase;font-size:11px;letter-spacing:.08em}
main{padding:18px}.screen{display:none}.screen.active{display:block}
.passport{max-width:420px;margin:45px auto;padding:34px 26px;text-align:center;background:linear-gradient(145deg,#ead7b8,#f6ead3);border:1px solid #c9b48e;border-radius:18px;box-shadow:0 18px 45px #372a1b29}
.passport h1{font-size:36px;margin:4px 0}.passport h2{font-size:20px;color:var(--red);letter-spacing:.18em;margin:0 0 24px}.qr{width:170px;height:170px;margin:18px auto;background:white;border:10px solid white;border-radius:8px;display:grid;place-items:center}.qr img{width:100%;height:100%}
.stamp{display:inline-block;border:2px solid var(--red);color:var(--red);padding:7px 14px;border-radius:50%;transform:rotate(-8deg);letter-spacing:.12em;font-size:11px;margin-top:16px}
.map-shell{position:relative;border:5px double var(--line);border-radius:4px;overflow:hidden;box-shadow:0 12px 30px #372a1b1f;background:#e8dfca}.map-title{position:absolute;z-index:500;left:20px;top:20px;background:#fbf6eaf2;padding:15px 20px;border:2px solid var(--turq);box-shadow:0 8px 20px #372a1b1f;border-radius:4px}.map-title h1{margin:0;font-size:29px}.map-title p{margin:4px 0 0;color:var(--red);font-size:13px;letter-spacing:.15em;text-transform:uppercase}.map-note{position:absolute;z-index:500;right:20px;bottom:20px;background:#fbf6eaf2;padding:10px 14px;border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--muted)}
#leafletMap{height:650px;filter:sepia(.12) saturate(.82)}.vintage-pin{width:28px;height:28px;border-radius:50% 50% 50% 0;background:var(--red);border:3px solid #f8efdd;box-shadow:0 3px 7px #332b2244;transform:rotate(-45deg)}.vintage-pin span{display:block;transform:rotate(45deg);color:#f8efdd;text-align:center;line-height:22px;font-size:13px}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--paper2)}.pin-card{min-width:190px}.pin-card h3{margin:0 0 4px}.pin-card p{margin:3px 0;color:var(--muted);font-size:12px}.pin-card button{margin-top:9px;background:var(--red);color:white;border:0;border-radius:7px;padding:8px 11px;cursor:pointer}
.file{background:var(--paper2);border:1px solid var(--line);border-top:10px solid var(--turq);border-radius:3px;box-shadow:0 18px 45px #372a1b29;overflow:hidden}.backline{margin:0 0 12px}.backline button{background:transparent;border:0;color:var(--red);cursor:pointer;padding:0}.file-head{padding:24px 26px;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:center}.photo{width:150px;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.file-head h1{margin:0 0 5px;font-size:30px}.file-head p{margin:3px 0;color:var(--muted)}
.tabs{display:flex;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);overflow:auto}.tab{border:1px solid var(--line);border-bottom:3px solid var(--turq);background:#e9ddc8;padding:10px 15px;border-radius:3px 3px 0 0;cursor:pointer;white-space:nowrap;text-transform:uppercase;font-size:11px;letter-spacing:.08em}.tab.active{background:var(--paper2);font-weight:bold}.file-body{padding:24px}.memory{font-size:17px;line-height:1.65;max-width:720px}
.recipe-drawer{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.divider{background:#e5d8c0;border:1px solid var(--line);padding:16px;border-radius:9px;cursor:pointer;position:relative}.divider:after{content:"";position:absolute;right:12px;top:-1px;width:50px;height:7px;background:var(--red);border-radius:0 0 5px 5px}.divider h3{margin:0 0 5px}.divider p{margin:0;color:var(--muted);font-size:13px}
.cards{max-width:860px;margin:auto}.recipe-card{background:#f8efdd;border:1px solid #cdbb9e;border-radius:3px;padding:30px;box-shadow:0 12px 28px #372a1b24;min-height:430px;position:relative;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,rgba(116,103,86,.08) 32px)}.paperclip{position:absolute;right:20px;top:15px;font-size:24px;color:#8d877c}.eyebrow{color:var(--red);text-transform:uppercase;letter-spacing:.12em;font-size:12px}.recipe-card h1{font-size:34px;margin:8px 0 3px}.recipe-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:28px;margin-top:20px}.recipe-grid h4{margin:0 0 9px;text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--muted)}ul,ol{padding-left:20px;line-height:1.6}.notes{color:var(--muted);font-style:italic;line-height:1.6}.flipbar{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.flipbar button,.cook-btn{border:1px solid var(--line);background:var(--paper2);border-radius:8px;padding:10px 15px;cursor:pointer}.cook-btn{background:var(--red);color:white;border-color:var(--red);font-weight:bold}
.cook{max-width:920px;margin:auto;background:#f8efdd;color:var(--ink);border:1px solid #cdbb9e;border-top:10px solid var(--turq);border-radius:3px;padding:32px;box-shadow:0 18px 45px #372a1b29}.cook .eyebrow{color:var(--red)}.cook h1{font-size:40px;margin:6px 0 5px}.cook-meta{color:var(--muted);font-size:14px;margin-bottom:25px}.cook-document{display:grid;grid-template-columns:minmax(210px,.75fr) minmax(280px,1.25fr);gap:36px;border-top:1px solid var(--line);padding-top:24px}.cook-document h4{margin:0 0 10px;text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--muted)}.cook-document ul,.cook-document ol{line-height:1.75}.cook-note{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-style:italic;line-height:1.65}.cook-footer{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:15px;border-top:1px solid var(--line)}.cook-footer button{border:1px solid var(--line);background:var(--turq2);padding:11px 15px;border-radius:4px;cursor:pointer;text-transform:uppercase;font-size:11px;letter-spacing:.08em}
@media(max-width:700px){main{padding:10px}header{padding:12px 14px}#leafletMap{height:72vh;min-height:520px}.map-title{left:10px;top:10px}.map-title h1{font-size:23px}.map-note{right:10px;bottom:10px}.file-head{align-items:flex-start;flex-direction:column}.recipe-grid{grid-template-columns:1fr}.recipe-card{padding:20px}.recipe-card h1{font-size:29px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><b>The Digital Food Passport</b><br><span id="crumb">Paris, France</span></div>
  <div><button class="ghost" onclick="showScreen('passport')">Passport</button><button class="ghost" onclick="showScreen('map')">Paris Map</button></div>
</header>
<main>
<section id="passport" class="screen">
  <div class="passport">
    <div class="brand">The Digital</div><h1>FOOD PASSPORT</h1><h2>PARIS · FRANCE</h2>
    <div class="qr"><img id="qrImg" alt="Paris QR code"></div>
    <div>Scan to explore your Paris food map.</div><div class="stamp">PARIS • FRANCE</div>
    <p style="color:#756b5d;font-size:13px">Prototype city card. The final QR can point to your permanent Paris page.</p>
    <button class="cook-btn" style="margin-top:12px" onclick="showScreen('map')">Enter Paris →</button>
  </div>
</section>
<section id="map" class="screen">
  <div class="map-shell"><div id="leafletMap"></div><div class="map-title"><h1>Paris</h1><p>France · May 2024</p></div><div class="map-note">Tap a pin to open a restaurant file.</div></div>
</section>
<section id="restaurant" class="screen">
  <div class="backline"><button onclick="showScreen('map')">← Back to Paris map</button></div>
  <div class="file">
    <div class="file-head"><img class="photo" id="restPhoto" alt=""><div><h1 id="restName"></h1><p id="restLocation"></p><p id="restDate" style="color:var(--red)"></p></div></div>
    <div class="tabs">
      <button class="tab active" onclick="setTab(this,'about')">ABOUT</button><button class="tab" onclick="setTab(this,'photos')">PHOTOS</button><button class="tab" onclick="setTab(this,'recipes')">RECIPES</button><button class="tab" onclick="setTab(this,'memories')">MEMORIES</button>
    </div>
    <div class="file-body" id="fileBody"></div>
  </div>
</section>
<section id="recipe" class="screen">
  <div class="backline"><button onclick="showRestaurant()">← Back to restaurant file</button></div>
  <div class="cards"><div class="recipe-card" id="recipeCard"></div><div class="flipbar"><button onclick="prevRecipe()">← Previous</button><span class="counter" id="counter"></span><button onclick="nextRecipe()">Next →</button></div></div>
</section>
<section id="cook" class="screen">
  <div class="backline"><button onclick="showRecipe()">← Back to recipe card</button></div>
  <div class="cook" id="cookBox"></div>
</section>
</main></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const restaurants=[
 {id:'cafe',name:'Café de Flore',location:'Saint-Germain-des-Prés, Paris',date:'Visited May 22, 2024',lat:48.8546,lng:2.3336,photo:'https://images.unsplash.com/photo-1559925393-8be0ec4767c8?auto=format&fit=crop&w=800&q=80',memory:'Sat here with coffee and people-watched for hours. It felt like the perfect Paris afternoon.',recipes:[
  {name:'Croque Monsieur',category:'Mains',note:'Our go-to lunch when in Paris. Crisp outside, creamy inside.',ingredients:['2 slices pain de mie','2 slices ham','2 slices Gruyère','1 tbsp béchamel sauce','1 tsp Dijon mustard','Butter'],steps:['Butter the bread and assemble the ham and cheese.','Spread béchamel over the top and add Dijon mustard.','Broil until bubbling and golden.','Rest for 2 minutes, then serve.']},
  {name:'Café Crème',category:'Drinks',note:'A simple ritual from a long morning walk.',ingredients:['1 espresso','120 ml steamed milk'],steps:['Brew the espresso.','Steam the milk until silky.','Pour together and serve immediately.']},
  {name:'Tarte Tatin',category:'Desserts',note:'A buttery apple dessert to remember the trip by.',ingredients:['Apples','Butter','Sugar','Puff pastry'],steps:['Caramelize sugar and butter in an oven-safe pan.','Arrange apples over the caramel.','Cover with pastry.','Bake until deeply golden and invert carefully.']}
 ]},
 {id:'chartier',name:'Bouillon Chartier',location:'Grands Boulevards, Paris',date:'Visited May 24, 2024',lat:48.8719,lng:2.3442,photo:'https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=800&q=80',memory:'A lively old-school dining room and the feeling of being dropped into another era.',recipes:[
  {name:'French Onion Soup',category:'Mains',note:'Deeply caramelized onions and plenty of bread.',ingredients:['Onions','Butter','Beef stock','Bread','Gruyère'],steps:['Slowly caramelize onions in butter.','Add stock and simmer.','Ladle into bowls, top with bread and Gruyère.','Broil until bubbling.']}
 ]},
 {id:'pain',name:'Du Pain et des Idées',location:'Canal Saint-Martin, Paris',date:'Visited May 25, 2024',lat:48.8715,lng:2.3650,photo:'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=800&q=80',memory:'We picked up pastries for a picnic by the canal.',recipes:[
  {name:'Pain au Chocolat',category:'Breakfast & Pastries',note:'The pastry that started the morning.',ingredients:['Croissant dough','Dark chocolate','Egg wash'],steps:['Cut and fill the dough with chocolate.','Roll, proof and brush with egg wash.','Bake until crisp and deeply golden.']}
 ]}
];
let currentRestaurant=null,currentRecipe=0,map=null;

function showScreen(id){
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 window.scrollTo(0,0);
 if(id==='map') setTimeout(()=>{if(map) map.invalidateSize()},80);
}
function openRestaurant(id){
 currentRestaurant=restaurants.find(r=>r.id===id); currentRecipe=0;
 document.getElementById('restName').textContent=currentRestaurant.name;
 document.getElementById('restLocation').textContent=currentRestaurant.location;
 document.getElementById('restDate').textContent=currentRestaurant.date;
 document.getElementById('restPhoto').src=currentRestaurant.photo;
 setTab(document.querySelector('.tab'),'about'); showScreen('restaurant');
}
function setTab(btn,tab){
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); btn.classList.add('active');
 const r=currentRestaurant, body=document.getElementById('fileBody');
 if(tab==='about') body.innerHTML=`<div class="memory"><p><b>About</b></p><p>${r.memory}</p><p style="color:var(--red)">Tap RECIPES above to browse the recipes collected from this place.</p></div>`;
 if(tab==='photos') body.innerHTML=`<img src="${r.photo}" style="max-width:100%;width:520px;border-radius:10px;border:1px solid var(--line)" alt="${r.name}"><p style="color:var(--muted)">Trip photo — ${r.date}</p>`;
 if(tab==='memories') body.innerHTML=`<div class="memory"><p>${r.memory}</p><p>More travel memories can be added here later: people, meals, stories, photos, and notes.</p></div>`;
 if(tab==='recipes') body.innerHTML=`<div class="recipe-drawer">${r.recipes.map((x,i)=>`<div class="divider" onclick="openRecipe(${i})"><h3>${x.name}</h3><p>${x.category}</p></div>`).join('')}</div>`;
}
function showRestaurant(){openRestaurant(currentRestaurant.id)}
function openRecipe(i){currentRecipe=i;renderRecipe();showScreen('recipe')}
function renderRecipe(){
 const r=currentRestaurant,x=r.recipes[currentRecipe];
 document.getElementById('recipeCard').innerHTML=`<div class="paperclip">⌇</div><div class="eyebrow">${x.category} · ${r.name}</div><h1>${x.name}</h1><p style="color:var(--muted)">Collected in ${r.location}</p><div class="recipe-grid"><div><h4>Ingredients</h4><ul>${x.ingredients.map(v=>`<li>${v}</li>`).join('')}</ul></div><div><h4>Notes</h4><p class="notes">${x.note}</p><h4 style="margin-top:25px">Instructions</h4><ol>${x.steps.map(v=>`<li>${v}</li>`).join('')}</ol></div></div><button class="cook-btn" onclick="startCook()" style="margin-top:18px">Cook this recipe →</button>`;
 document.getElementById('counter').textContent=`${currentRecipe+1} / ${r.recipes.length}`;
}
function nextRecipe(){currentRecipe=(currentRecipe+1)%currentRestaurant.recipes.length;renderRecipe()}
function prevRecipe(){currentRecipe=(currentRecipe-1+currentRestaurant.recipes.length)%currentRestaurant.recipes.length;renderRecipe()}
function showRecipe(){renderRecipe();showScreen('recipe')}
function startCook(){const r=currentRestaurant,x=r.recipes[currentRecipe];document.getElementById('cookBox').innerHTML=`<div class="eyebrow">${x.category} · ${r.name}</div><h1>${x.name}</h1><div class="cook-meta">Collected in ${r.location} · ${r.date}</div><div class="cook-document"><div><h4>Ingredients</h4><ul>${x.ingredients.map(v=>`<li>${v}</li>`).join('')}</ul></div><div><h4>Instructions</h4><ol>${x.steps.map(v=>`<li>${v}</li>`).join('')}</ol></div></div><div class="cook-note"><b>Travel note:</b> ${x.note}</div><div class="cook-footer"><span style="color:var(--muted);font-size:12px">${currentRecipe+1} of ${r.recipes.length} recipes from this file</span><button onclick="showRecipe()">← Back to recipe card</button></div>`;showScreen('cook')}

function init(){
 const qrTarget=location.href.split('#')[0]+'#paris';
 document.getElementById('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=240x240&data='+encodeURIComponent(qrTarget);
 map=L.map('leafletMap').setView([48.8566,2.3522],13);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
 restaurants.forEach(r=>{const icon=L.divIcon({className:'',html:`<div class="vintage-pin"><span>•</span></div>`,iconSize:[28,28],iconAnchor:[10,26],popupAnchor:[4,-22]});const marker=L.marker([r.lat,r.lng],{icon}).addTo(map);marker.bindPopup(`<div class="pin-card"><h3>${r.name}</h3><p>${r.location}</p><p>${r.recipes.length} recipe${r.recipes.length>1?'s':''}</p><button onclick="openRestaurant('${r.id}')">Open file →</button></div>`);});
 showScreen('passport');
}
init();
</script>
</body>
</html>
